worker_processes 1;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 8080;

    location /stat {
      rtmp_stat all;
      add_header Cache-Control no-cache always;
      add_header Access-Control-Allow-Origin * always;
    }

    location /healthz {
      return 200 "ok";
    }

    location /hls/ {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }

      add_header Cache-Control no-cache always;
      add_header Access-Control-Allow-Origin * always;
      root /tmp;
    }
  }
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;

      hls on;
      hls_path /tmp/hls;
      hls_nested on;
      hls_fragment 2s;
      hls_playlist_length 6s;
      hls_cleanup on;

      # Validate stream key + create session
      on_publish http://api:8000/ingest/on_publish;
      # Heartbeat while publishing (updates last_publish_at)
      notify_method post;
      notify_update_timeout 5s;
      on_update http://api:8000/ingest/on_update;
      on_publish_done http://api:8000/ingest/on_publish_done;
    }

    # Local/testing output app (no validation hooks).
    # In production, targets point to external platforms, not back into ingest.
    application out {
      live on;
      record off;
    }
  }
}
